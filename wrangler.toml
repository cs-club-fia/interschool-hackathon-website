name = "interschool-hackathon-fia"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Static frontend (CodeMirror, CSS, timer/editor JS, logos) is served straight
# from ./public. Any request that does NOT match a file there falls through to
# the Worker in src/index.ts, which renders the dynamic pages server-side.
[assets]
directory = "./public"

# D1 (serverless SQLite) holds all runtime state: submissions (incl. the
# student's code), autosaved drafts, and anti-cheat metrics. Durable across
# redeploys. Fill in database_id after: wrangler d1 create hackathon
[[d1_databases]]
binding = "DB"
database_name = "hackathon"
database_id = "9327b27e-d99e-49dd-bb8e-03773a373f72"
migrations_dir = "migrations"

# SECRET_KEY (HMAC signing for session cookies) is NOT stored here.
# Set it as a secret:  wrangler secret put SECRET_KEY
# For local `wrangler dev`, put it in .dev.vars (gitignored).

# PISTON_URL points the question-page "Run" button at your self-hosted Piston
# instance. It is just a URL (not a secret), so either set it as a plaintext var
# below, or -- if you'd rather keep the host private -- as a secret
# (`wrangler secret put PISTON_URL`). For local `wrangler dev`, add it to
# .dev.vars. Value is the host or the /api/v2/piston base; both are accepted.
# If unset, the Run panel shows "Code runner is not configured" and nothing else
# breaks.
# [vars]
# PISTON_URL = "https://piston.your-host.example.com"
