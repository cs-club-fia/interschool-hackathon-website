name = "interschool-hackathon-fia"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Static frontend (CodeMirror, CSS, timer/editor JS, logos) is served straight
# from ./public. Any request that does NOT match a file there falls through to
# the Worker in src/index.ts, which renders the dynamic pages server-side.
[assets]
directory = "./public"

# D1 (serverless SQLite) holds all runtime state: submissions (incl. the
# student's code), autosaved drafts, and anti-cheat metrics. Durable across
# redeploys. Fill in database_id after: wrangler d1 create hackathon
[[d1_databases]]
binding = "DB"
database_name = "hackathon"
database_id = "9327b27e-d99e-49dd-bb8e-03773a373f72"
migrations_dir = "migrations"

# SECRET_KEY (HMAC signing for session cookies) is NOT stored here.
# Set it as a secret:  wrangler secret put SECRET_KEY
# For local `wrangler dev`, put it in .dev.vars (gitignored).

# PISTON_URL is now only a FALLBACK for the code-runner endpoint -- in normal
# operation the live URL is stored in D1 (the `config` table) and kept current
# automatically by scripts/piston-tunnel.ps1 (see PISTON-SETUP.md). Set this
# only if you want a static default when no D1 config row exists yet.
# [vars]
# PISTON_URL = "https://piston.your-host.example.com"

# PISTON_AUTH_TOKEN: shared secret the Worker sends as X-Piston-Key to the
# local Piston auth-proxy (scripts/piston-proxy.mjs). Must match that proxy's
# configured authToken (in scripts/piston.local.json).
#   wrangler secret put PISTON_AUTH_TOKEN

# PISTON_ADMIN_TOKEN: bearer token required by POST /internal/piston-url
# (called by scripts/piston-tunnel.ps1 to self-update the stored Piston URL).
# Must match that script's configured adminToken. Required -- the route is
# disabled entirely if this secret is unset.
#   wrangler secret put PISTON_ADMIN_TOKEN
